syntax = "proto3";

package pkgr;
option go_package = "github.com/wargesz/pkgr/proto;pb";

service Dispatcher {
  rpc ConnectWorker (stream BuildResult) returns (stream BuildTask);
  rpc RequestArtifact (ArtifactRequest) returns (stream BuildResult);
}


message BuildTask {
  string name = 1;
  string source = 2;
  repeated string needs = 3;
  repeated string steps = 4;
  repeated string binaries = 5;
}

message BuildResult {
  oneof content {
    string build_log = 1;
    ArtifactChunk artifact_chunk = 2;
    bool complete = 3;
  }
}

message ArtifactChunk {
  string filename = 1;
  bool empty = 2;
  bytes data = 3;
}

message ArtifactRequest {
  string name = 1;
}
